name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: cla-assistant/github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The PR comment must exactly match this string to pass the check
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'CONTRIBUTORS.txt'
          path-to-document: 'https://github.com/jeffery9/odoo-farm/blob/dev/CLA.md' # Adjust repo URL if needed
          branch: 'dev'
          allowlist: 'dependabot[bot]'
          custom-notsigned-prcomment: 'Thank you for your pull request to the Odoo Farm project! Before we can merge it, you must sign the Contributor License Agreement (CLA).<br/>Please read the [CLA Document](https://github.com/jeffery9/odoo-farm/blob/dev/CLA.md) and reply to this PR with the following text to sign it:<br/>**I have read the CLA Document and I hereby sign the CLA**'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
