# Configuration for Automated Release Script
# These settings can be modified to change the behavior of the release script

# Source branch (default: dev)
SOURCE_BRANCH="dev"

# Target branch (default: 19.0)
TARGET_BRANCH="19.0"

# Pattern for documentation files to exclude
DOC_FILE_PATTERNS=("\.md$" "^docs/" "README.md$")

# Conflict resolution strategy (options: "dev", "manual")
CONFLICT_RESOLUTION="dev"

# Whether to automatically push to remote after successful release
AUTO_PUSH="false"

# Whether to run tests after cherry-picking (if test script exists)
RUN_TESTS="false"

# Test command to run (if RUN_TESTS is true)
TEST_COMMAND="python -m pytest tests/ -v"