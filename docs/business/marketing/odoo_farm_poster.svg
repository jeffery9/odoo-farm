<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Linear Gradients for Premium Aesthetics -->
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF5" />
      <stop offset="100%" stop-color="#FFF3E8" />
    </linearGradient>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9382B" />
      <stop offset="100%" stop-color="#E54E3D" />
    </linearGradient>
    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#8BC34A" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C9382B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="600" fill="url(#gradBg)" />

  <!-- Decorative Abstract Geometric Shapes (Dynamic Bio-curves) -->
  <path d="M 0,350 C 300,200 500,450 800,250 C 950,150 1100,250 1200,180 L 1200,600 L 0,600 Z" fill="#FBF1E6" opacity="0.6" />
  <path d="M 0,400 C 400,320 600,500 900,350 C 1050,270 1150,330 1200,280 L 1200,600 L 0,600 Z" fill="#F7E6D7" opacity="0.4" />

  <!-- 2. Logo & Branding Header -->
  <g transform="translate(100, 100)">
    <!-- Shield/Emblem -->
    <rect width="80" height="80" rx="20" fill="url(#gradPrimary)" filter="url(#shadow)" />
    <path d="M 40,22 L 60,34 L 60,56 L 40,68 L 20,56 L 20,34 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
    <path d="M 40,30 L 40,60" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <path d="M 30,45 L 50,45" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Title -->
    <text x="110" y="44" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="44" fill="#C9382B" letter-spacing="1">Agri-OS</text>
    <text x="110" y="72" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="18" fill="#5F6368" letter-spacing="4">COMPUTABLE AGRICULTURE OS</text>
  </g>

  <!-- 3. Main Slogan -->
  <g transform="translate(100, 240)">
    <text x="0" y="0" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="52" fill="#202124" letter-spacing="2">智慧农业全链路数字化底座</text>
    <text x="0" y="56" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" font-size="28" fill="#8BC34A" letter-spacing="1">Computable, Decoupled &amp; Standardized Smart Agriculture OS</text>
  </g>

  <!-- 4. Value Pillars (3 cards) -->
  <!-- Card 1: 16 Verticals -->
  <g transform="translate(100, 370)">
    <rect width="310" height="140" rx="16" fill="#FFFFFF" filter="url(#shadow)" />
    <circle cx="50" cy="50" r="24" fill="#E8F0FE" />
    <text x="38" y="58" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="24" fill="#1A73E8">16</text>
    <text x="100" y="48" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="20" fill="#202124">垂直行业白皮书</text>
    <text x="100" y="74" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="14" fill="#5F6368">精细覆盖种植、养殖与初深加工</text>
    <text x="100" y="96" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="12" fill="#888888">16 Industry-specific Solutions</text>
  </g>

  <!-- Card 2: Bio-Clock -->
  <g transform="translate(440, 370)">
    <rect width="310" height="140" rx="16" fill="#FFFFFF" filter="url(#shadow)" />
    <circle cx="50" cy="50" r="24" fill="#E6F4EA" />
    <path d="M 42,42 L 50,50 L 58,50" fill="none" stroke="#137333" stroke-width="4" stroke-linecap="round" />
    <circle cx="50" cy="50" r="14" fill="none" stroke="#137333" stroke-width="3" />
    <text x="100" y="48" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="20" fill="#202124">生物时序对齐</text>
    <text x="100" y="74" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="14" fill="#5F6368">动植物自然生长规律模型化约束</text>
    <text x="100" y="96" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="12" fill="#888888">Biological Cycle Alignment</text>
  </g>

  <!-- Card 3: Sovereign Security -->
  <g transform="translate(780, 370)">
    <rect width="310" height="140" rx="16" fill="#FFFFFF" filter="url(#shadow)" />
    <circle cx="50" cy="50" r="24" fill="#FCE8E6" />
    <path d="M 40,38 L 50,38 L 54,48 L 46,48 Z" fill="none" stroke="#C5221F" stroke-width="3" />
    <rect x="42" y="46" width="16" height="12" rx="3" fill="none" stroke="#C5221F" stroke-width="3" />
    <text x="100" y="48" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="20" fill="#202124">金融级行级隔离</text>
    <text x="100" y="74" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="14" fill="#5F6368">双受让自然人主权与 3-Tier RLS</text>
    <text x="100" y="96" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="500" font-size="12" fill="#888888">Financial-grade Data Isolation</text>
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(1000, 100)" opacity="0.15">
    <text x="0" y="0" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="16" fill="#202124" letter-spacing="2">DEVELOPED BY</text>
    <text x="0" y="24" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="900" font-size="20" fill="#C9382B">JEFFERY9</text>
  </g>
</svg>
